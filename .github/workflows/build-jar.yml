name: Build outline jar

on:
  push:
    branches:
      - claude/minecraft-fabric-mod-1-21-11-mjo0yr
      - claude/minecraft-fabric-mod-compile-f66e1f
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Commit jar back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/libs/outline-1.0.0.jar
          if git diff --cached --quiet; then
            echo "Jar unchanged, nothing to commit"
          else
            git commit -m "Add compiled outline-1.0.0.jar [skip ci]"
            git push
          fi
